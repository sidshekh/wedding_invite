<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidhant & Ishita - System Boot</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        #terminal {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .rsvp-btn {
            color: #00ff00;
            background: none;
            border: 1px solid #00ff00;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 12px;
            margin: 8px 5px 0 0;
            display: none;
        }
        .rsvp-btn:hover {
            background: #00ff00;
            color: #000;
        }

        .input-container {
            display: none;
            margin-top: 15px;
        }
        .terminal-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #00ff00;
            color: #00ff00;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            width: 220px;
        }
        .submit-btn {
            color: #00ff00;
            background: none;
            border: 1px solid #00ff00;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            margin-left: 10px;
            padding: 2px 8px;
        }
        .submit-btn:hover {
            background: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="terminal"></div>
    <span class="cursor" id="cursor"></span>

    <div id="namePrompt" class="input-container">
        <span>Enter Guest Name(s): </span>
        <input type="text" id="guestName" class="terminal-input" placeholder="e.g. Rahul & Neha" autofocus>
        <button id="submitBtn" class="submit-btn">Submit</button>
    </div>

    <script>
        // BACKEND ENDPOINT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1pFxKq1w-8_lHsrKqnfAUdZ508TjPAJWy9PQMJhAEqdzPNY0lllO4a54yCHTk3HYh/exec";

        const bootSequence = [
            "[ OK ] Powering on...",
            "[ OK ] Booting kernel SID_ISH_OS v.20.26...",
            "[ OK ] Mounting root filesystem...",
            "[ OK ] Initializing core group components... ",
            "[ OK ] Allocating mask 0x2000 for lifetime_mem...",
            "[ OK ] Bypassing endianness checks... Cache aligned.",
            "[ OK ] Storing couple in Non-Volatile Cache... Lifetime retention active.",
            "[ OK ] Verifying Ring Buffer... 💍 lock engaged.",
            "Flashing lifetime firmware... [||||||||||||||||||] 100%",
            "[INFO] Compiling union: Sidhant && Ishita",
            "",
            ">>> SYSTEM ALERT: Major Event Executing <<<",
            "Event_Type: Wedding",
            "Target_Date: 04-Dec-2026",
            "Location_Protocol: Radisson_Blu_Ranchi_Coordinates.cfg",
            "",
            "Awaiting User Input for Event Confirmation...",
            "RSVP_Status (Click an option): "
        ];

        let lineIndex = 0;
        let charIndex = 0;
        let selectedStatus = "";
        const terminal = document.getElementById("terminal");
        let currentText = "";

        function typeWriter() {
            if (lineIndex < bootSequence.length) {
                if (charIndex < bootSequence[lineIndex].length) {
                    currentText += bootSequence[lineIndex].charAt(charIndex);
                    terminal.innerHTML = currentText;
                    charIndex++;
                    setTimeout(typeWriter, 25);
                } else {
                    currentText += "\n";
                    terminal.innerHTML = currentText;
                    charIndex = 0;
                    lineIndex++;
                    setTimeout(typeWriter, 400); 
                }
            } else {
                showRSVPButtons();
            }
        }

        function showRSVPButtons() {
            const btnY = document.createElement("button");
            btnY.innerText = "[Y] Accept";
            btnY.className = "rsvp-btn";
            btnY.style.display = "inline-block";
            
            const btnN = document.createElement("button");
            btnN.innerText = "[N] Decline";
            btnN.className = "rsvp-btn";
            btnN.style.display = "inline-block";

            btnY.onclick = () => handleChoice("[Y] Accept", "Accepted");
            btnN.onclick = () => handleChoice("[N] Decline", "Declined");

            terminal.appendChild(btnY);
            terminal.appendChild(btnN);
        }

        function handleChoice(textLabel, statusValue) {
            selectedStatus = statusValue;
            
            const buttons = document.querySelectorAll('.rsvp-btn');
            buttons.forEach(btn => btn.style.display = 'none');

            terminal.innerHTML += textLabel + "\n\n";
            document.getElementById("namePrompt").style.display = "block";
            document.getElementById("guestName").focus();
        }

        function sendData() {
            const nameInput = document.getElementById("guestName").value.trim();
            if (!nameInput) {
                alert("Please enter your name.");
                return;
            }

            document.getElementById("namePrompt").style.display = "none";
            terminal.innerHTML += "Adding you to the DMA queue... ";

            const payload = {
                name: nameInput,
                status: selectedStatus
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                if (selectedStatus === "Accepted") {
                    terminal.innerHTML += "\n\n[ OK ] Added to DMA queue!\n[ OK ] See you at Radisson Blu, Ranchi on Dec 4th 🎉";
                } else {
                    terminal.innerHTML += "\n\n[ OK ] Added to DMA queue.\n[WARN] Connection closed. We will miss you!";
                }
                document.getElementById("cursor").style.display = "none";
            })
            .catch(err => {
                terminal.innerHTML += "\n[ERR] Transfer timeout. Please try again.";
            });
        }

        document.getElementById("submitBtn").onclick = sendData;
        document.getElementById("guestName").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendData();
        });

        window.onload = () => { setTimeout(typeWriter, 500); };
    </script>
</body>
</html>
